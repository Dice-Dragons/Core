name: XenForo Release Publisher (Core)

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Dry run - log details only, do not post to API"
        required: false
        type: boolean
        default: false
    secrets:
      XENFORO_API_KEY:
        required: true
      XENFORO_API_USER_ID:
        required: true

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to test (leave empty for latest release)"
        required: false
        type: string
      dry_run:
        description: "Dry Run (Only log output)"
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Release Asset or Fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -e

          TAG_NAME="$INPUT_TAG"
          if [ -z "$TAG_NAME" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi

          echo "Target Tag: ${TAG_NAME:-'Latest Release'}"

          # Download attached zip assets
          if [ -n "$TAG_NAME" ]; then
            gh release download "$TAG_NAME" --repo "${{ github.repository }}" --pattern "*.zip" || true
          else
            gh release download --repo "${{ github.repository }}" --pattern "*.zip" || true
          fi

          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)

          if [ -z "$ZIP_FILE" ] && [ -d "_releases" ]; then
            ZIP_FILE=$(ls _releases/*.zip 2>/dev/null | head -n 1)
          fi

          # Fallback for manual workflow_dispatch test if no release ZIP is found
          if [ -z "$ZIP_FILE" ]; then
            echo "::warning::No release ZIP found. Creating dummy test ZIP for debug run..."
            zip -r test-release.zip addon.json _docs/ 2>/dev/null || touch test-release.zip
            ZIP_FILE="test-release.zip"
          fi

          echo "Found release asset: $ZIP_FILE"
          echo "ZIP_FILE_PATH=$ZIP_FILE" >> $GITHUB_ENV

      - name: Extract Metadata & Post Update to XenForo
        env:
          XF_API_KEY: ${{ secrets.XENFORO_API_KEY }}
          XF_API_USER: ${{ secrets.XENFORO_API_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e

          ADDON_JSON="addon.json"
          if [ ! -f "$ADDON_JSON" ]; then
            echo "::error::addon.json not found in repository root!"
            exit 1
          fi

          # Check if secrets are missing/empty
          if [ -z "$XF_API_KEY" ]; then
            echo "::error::XENFORO_API_KEY secret is missing or empty in GitHub Repository Secrets!"
            exit 1
          fi

          if [ -z "$XF_API_USER" ]; then
            echo "::error::XENFORO_API_USER_ID secret is missing or empty in GitHub Repository Secrets!"
            exit 1
          fi

          # Clean secrets of potential carriage returns/whitespace
          XF_API_KEY=$(echo "$XF_API_KEY" | tr -d '\r\n ')
          XF_API_USER=$(echo "$XF_API_USER" | tr -d '\r\n ')

          # Check if XF_API_USER is numeric
          if ! [[ "$XF_API_USER" =~ ^[0-9]+$ ]]; then
            echo "::warning::XENFORO_API_USER_ID is set to '$XF_API_USER', but XenForo API expects a numeric user_id (e.g. 1). Please update the secret to the integer user_id."
          fi

          # 1. Parse metadata from addon.json
          VERSION_STRING=$(jq -r '.version_string // empty' "$ADDON_JSON" | tr -d '\r\n')
          VERSION_ID=$(jq -r '.version_id // empty' "$ADDON_JSON" | tr -d '\r\n')
          FAQ_URL=$(jq -r '.faq_url // empty' "$ADDON_JSON" | tr -d '\r\n')
          RESOURCE_ID=$(echo "$FAQ_URL" | grep -oE '[0-9]+/?$' | tr -d '/')

          TITLE="Version ${VERSION_STRING}"

          echo "================ DEBUG ================"
          echo "Parsed VERSION_ID:     '$VERSION_ID'"
          echo "Parsed VERSION_STRING: '$VERSION_STRING'"
          echo "Parsed RESOURCE_ID:    '$RESOURCE_ID'"
          echo "API User ID:           '$XF_API_USER'"
          echo "API Key Length:        ${#XF_API_KEY} chars"
          echo "======================================="

          # 2. Locate BBCode file
          DOCS_FILE=""
          if [ -f "./_docs/changelog.${VERSION_ID}.bbcode" ]; then
            DOCS_FILE="./_docs/changelog.${VERSION_ID}.bbcode"
          elif [ -f "./_docs/changelog.${VERSION_STRING}.bbcode" ]; then
            DOCS_FILE="./_docs/changelog.${VERSION_STRING}.bbcode"
          elif [ -f "./_docs/info.de.bbcode" ]; then
            DOCS_FILE="./_docs/info.de.bbcode"
          fi

          if [ -n "$DOCS_FILE" ] && [ -f "$DOCS_FILE" ]; then
            echo "SUCCESS: Found BBCode file at: $DOCS_FILE"
            MESSAGE_CONTENT=$(cat "$DOCS_FILE")
          else
            echo "::warning::No matching BBCode file found in ./_docs/!"
            MESSAGE_CONTENT="A new update to version [B]${VERSION_STRING}[/B] is now available."
          fi

          ZIP_FILE="$ZIP_FILE_PATH"

          # Dry Run Check
          if [ "$DRY_RUN" = "true" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN SUCCESSFUL ==="
            echo "Target API:  https://forum.dice-dragons.de/api/resources/${RESOURCE_ID}/versions"
            echo "Title:       $TITLE"
            echo "Version:     $VERSION_STRING"
            echo "Attachment:  $ZIP_FILE"
            echo "Docs File:   ${DOCS_FILE:-None (Fallback used)}"
            echo "Message:"
            echo "$MESSAGE_CONTENT"
            echo "==========================="
            exit 0
          fi

          # 3. XenForo API Call (2-step attachment upload)
          # Note: XenForo reads HTTP_XF_API_KEY, which corresponds to header "XF-Api-Key" (not "X-XF-Api-Key")
          echo "Step 1: Creating attachment key and uploading file..."
          ATTACH_RESP=$(curl -s -S -X POST "https://forum.dice-dragons.de/api/attachments/new-key" \
            -H "XF-Api-Key: ${XF_API_KEY}" \
            -H "XF-Api-User: ${XF_API_USER}" \
            -H "X-XF-Api-Key: ${XF_API_KEY}" \
            -H "X-XF-Api-User: ${XF_API_USER}" \
            -F "api_key=${XF_API_KEY}" \
            -F "api_user=${XF_API_USER}" \
            -F "type=resource_version" \
            -F "context[resource_id]=${RESOURCE_ID}" \
            -F "attachment=@${ZIP_FILE}")

          ATTACH_KEY=$(echo "$ATTACH_RESP" | jq -r '.key // empty')

          if [ -n "$ATTACH_KEY" ]; then
            echo "Attachment uploaded successfully. Key: $ATTACH_KEY"
            echo "Step 2: Creating resource version..."
            curl -s -S -X POST "https://forum.dice-dragons.de/api/resources/${RESOURCE_ID}/versions" \
              -H "XF-Api-Key: ${XF_API_KEY}" \
              -H "XF-Api-User: ${XF_API_USER}" \
              -H "X-XF-Api-Key: ${XF_API_KEY}" \
              -H "X-XF-Api-User: ${XF_API_USER}" \
              -F "api_key=${XF_API_KEY}" \
              -F "api_user=${XF_API_USER}" \
              -F "resource_id=${RESOURCE_ID}" \
              -F "version_string=${VERSION_STRING}" \
              -F "version_type=local" \
              -F "version_attachment_key=${ATTACH_KEY}"
          else
            echo "::warning::Attachment upload via new-key failed or key empty. Response: $ATTACH_RESP"
            echo "Attempting direct POST fallback..."
            curl -s -S -X POST "https://forum.dice-dragons.de/api/resources/${RESOURCE_ID}/versions" \
              -H "XF-Api-Key: ${XF_API_KEY}" \
              -H "XF-Api-User: ${XF_API_USER}" \
              -H "X-XF-Api-Key: ${XF_API_KEY}" \
              -H "X-XF-Api-User: ${XF_API_USER}" \
              -F "api_key=${XF_API_KEY}" \
              -F "api_user=${XF_API_USER}" \
              -F "resource_id=${RESOURCE_ID}" \
              -F "version_string=${VERSION_STRING}" \
              -F "version_type=local" \
              -F "attachment=@${ZIP_FILE}"
          fi