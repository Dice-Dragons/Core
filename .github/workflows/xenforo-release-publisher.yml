name: XenForo Release Publisher (Core)

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Dry run - log details only, do not post to API"
        required: false
        type: boolean
        default: false
    secrets:
      XENFORO_API_KEY:
        required: true
      XENFORO_API_USER_ID:
        required: true

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run ausführen? (Nur Log, kein API-Call)"
        required: true
        type: boolean
        default: true        
jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AddOn Repository
        uses: actions/checkout@v4

      - name: Download Release Asset from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Download all attached zip assets from the current GitHub Release
          gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --pattern "*.zip"

          # Find the downloaded ZIP file
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No .zip asset found attached to the GitHub Release!"
            exit 1
          fi

          echo "Found release asset: $ZIP_FILE (Size: $(du -h "$ZIP_FILE" | cut -f1))"
          echo "ZIP_FILE_PATH=$ZIP_FILE" >> $GITHUB_ENV

      - name: Extract Metadata & Post Update to XenForo
        env:
          XF_API_KEY: ${{ secrets.XENFORO_API_KEY }}
          XF_API_USER: ${{ secrets.XENFORO_API_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e

          ADDON_JSON="addon.json"
          if [ ! -f "$ADDON_JSON" ]; then
            echo "::error::addon.json not found in repository root!"
            exit 1
          fi

          # 1. Parse metadata from addon.json
          VERSION_STRING=$(jq -r '.version_string // empty' "$ADDON_JSON" | tr -d '\r\n')
          VERSION_ID=$(jq -r '.version_id // empty' "$ADDON_JSON" | tr -d '\r\n')
          ADDON_ID=$(jq -r '.legacy_addon_id // .title // "addon"' "$ADDON_JSON" | tr -d '\r\n')
          FAQ_URL=$(jq -r '.faq_url // empty' "$ADDON_JSON" | tr -d '\r\n')
          RESOURCE_ID=$(echo "$FAQ_URL" | grep -oE '[0-9]+/?$' | tr -d '/')

          if [ -z "$VERSION_STRING" ] || [ -z "$VERSION_ID" ] || [ -z "$RESOURCE_ID" ]; then
            echo "::error::Failed to parse version_string, version_id, or RESOURCE_ID from $ADDON_JSON!"
            exit 1
          fi

          TITLE="Version ${VERSION_STRING}"

          echo "=== DEBUG INFO ==="
          echo "VERSION_ID parsed as: '$VERSION_ID'"
          echo "VERSION_STRING parsed as: '$VERSION_STRING'"
          echo "Contents of ./_docs directory:"
          ls -la ./_docs || echo "Directory ./_docs does not exist!"
          echo "=================="

          # 2. Locate BBCode file
          DOCS_FILE=""
          if [ -f "./_docs/changelog.${VERSION_ID}.bbcode" ]; then
            DOCS_FILE="./_docs/changelog.${VERSION_ID}.bbcode"
          elif [ -f "_docs/changelog.${VERSION_ID}.bbcode" ]; then
            DOCS_FILE="_docs/changelog.${VERSION_ID}.bbcode"
          elif [ -f "./_docs/info.de.bbcode" ]; then
            DOCS_FILE="./_docs/info.de.bbcode"
          fi

          if [ -n "$DOCS_FILE" ] && [ -f "$DOCS_FILE" ]; then
            echo "SUCCESS: Found BBCode file at: $DOCS_FILE"
            MESSAGE_CONTENT=$(cat "$DOCS_FILE")
          else
            echo "::warning::No matching BBCode file found in ./_docs/!"
            MESSAGE_CONTENT="A new update to version [B]${VERSION_STRING}[/B] is now available."
          fi

          ZIP_FILE="$ZIP_FILE_PATH"

          # Dry Run Check
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN SUCCESSFUL ==="
            echo "Target API:  https://forum.dice-dragons.de/api/resources/${RESOURCE_ID}/versions"
            echo "Title:       $TITLE"
            echo "Version:     $VERSION_STRING"
            echo "Attachment:  $ZIP_FILE"
            echo "Docs File:   ${DOCS_FILE:-None (Fallback used)}"
            echo "Message:"
            echo "$MESSAGE_CONTENT"
            echo "==========================="
            exit 0
          fi

          # 3. XenForo API Call
          curl -X POST "https://forum.dice-dragons.de/api/resources/${RESOURCE_ID}/versions" \
            -H "X-XF-Api-Key: $XF_API_KEY" \
            -H "X-XF-Api-User: $XF_API_USER" \
            -F "version_string=${VERSION_STRING}" \
            -F "title=${TITLE}" \
            -F "message=${MESSAGE_CONTENT}" \
            -F "attachment=@${ZIP_FILE}"